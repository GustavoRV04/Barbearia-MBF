<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Gu-Barber Contatos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../imagens/man-5463556_640.png" type="image/x-icon">
  <link rel="stylesheet" type="text/css" href="../css/reset.css">
  <link rel="stylesheet" type="text/css" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <div id="sidebar-container"></div>

    <div class="content-area">
      <header class="topbar">
        <div class="page-title">
          <h1>Contatos</h1>
          <p>Fale conosco para agendar seu horário ou tirar dúvidas sobre nossos serviços.</p>
        </div>
        <div class="topbar-actions">
        <button class="icon-button sidebar-toggle" type="button" aria-label="Abrir ou fechar menu">
            <img src="../favicon/menu.png" alt="Abrir menu">
        </button>
        <button class="icon-button theme-toggle" type="button" aria-label="Alternar tema">
            <img src="../favicon/sunny.png" alt="Alternar tema">
        </button>
    </div>
      </header>

      <main class="page-main">
        <section class="form-card">
          <h2 class="titulo-principal">Cadastro de Cliente</h2>
          <form>
            <label for="Nomesobrenome">Nome e sobrenome</label>
            <input type="text" id="Nomesobrenome" class="input-padrao" placeholder="Digite seu nome completo">
            <label for="Email">E-mail</label>
            <input type="email" id="Email" class="input-padrao" required placeholder="seuemail@dominio.com">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" class="input-padrao" required placeholder="(xx) xxxxx-xxxx">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" class="input-padrao" placeholder="Digite sua mensagem"></textarea>
            <input type="submit" value="Enviar formulário" class="enviar">
          </form>
        </section>
      </main>

      <footer class="footer">
        <img src="../imagens/logo_branco.png" alt="Logo branco Gu-Barber">
        <p class="copy">&copy; copyright Gu-Barber Shop - 2026</p>

        <div class="footer-socials">
        <!-- Instagram -->
        <a href="https://instagram.com" target="_blank" aria-label="Instagram da barbearia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        </a>
        
        <!-- Facebook -->
        <a href="https://facebook.com" target="_blank" aria-label="Facebook da barbearia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
            </svg>
        </a>

        <!-- Twitter / X -->
        <a href="https://twitter.com" target="_blank" aria-label="Twitter da barbearia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
            </svg>
        </a>
    </div>
      </footer>
    </div>
  </div>

  <script src="../js/main.js"></script>

</body>
</html>
