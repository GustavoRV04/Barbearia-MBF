<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Gu-Barber Contatos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../imagens/man-5463556_640.png" type="image/x-icon">
  <link rel="stylesheet" type="text/css" href="../css/reset.css">
  <link rel="stylesheet" type="text/css" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <div id="sidebar-container"></div>

    <div class="content-area">
      <header class="topbar">
        <div class="page-title">
          <h1>Contatos</h1>
          <p>Fale conosco para agendar seu horário ou tirar dúvidas sobre nossos serviços.</p>
        </div>
        <div class="topbar-actions">
        <button class="icon-button sidebar-toggle" type="button" aria-label="Abrir ou fechar menu">
            <img src="../favicon/menu.png" alt="Abrir menu">
        </button>
        <button class="icon-button theme-toggle" type="button" aria-label="Alternar tema">
            <img src="../favicon/sunny.png" alt="Alternar tema">
        </button>
    </div>
      </header>

      <main class="page-main">
        <section class="form-card">
          <h2 class="titulo-principal">Cadastro de Cliente</h2>
          <form>
            <label for="Email">E-mail</label>
            <input type="email" id="Email" class="input-padrao" required placeholder="seuemail@dominio.com">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" class="input-padrao" required placeholder="(xx) xxxxx-xxxx">
            <label for="Nomesobrenome">Nome e sobrenome</label>
            <input type="text" id="Nomesobrenome" class="input-padrao" placeholder="Digite seu nome completo">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" class="input-padrao" placeholder="Digite sua mensagem"></textarea>
            <input type="submit" value="Enviar formulário" class="enviar">
          </form>
        </section>
      </main>

      <footer class="footer">
        <img src="../imagens/logo_branco.png" alt="Logo branco Gu-Barber">
        <p class="copy">&copy; copyright Gu-Barber Shop - 2026</p>
      </footer>
    </div>
  </div>

  <script src="../js/main.js"></script>

</body>
</html>
