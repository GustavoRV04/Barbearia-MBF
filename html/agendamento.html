<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agendamento - Barbearia</title>
  <link rel="shortcut icon" href="../imagens/man-5463556_640.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/agendamento.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <div id="sidebar-container"></div>
    <div class="content-area">
      <header class="topbar">
        <div class="page-title">
          <h1>Agende sua visita</h1>
          <p>Escolha o dia, horário, serviço e o profissional.</p>
        </div>
      </header>

      <main class="page-main agendamento-page">
        <section class="booking-card">
          <div class="booking-grid">
            <aside class="calendar-panel">
              <div class="calendar-header">
                <button id="prevMonth" aria-label="Mês anterior">‹</button>
                <h3 id="monthLabel"></h3>
                <button id="nextMonth" aria-label="Próximo mês">›</button>
              </div>
              <div class="weekdays">D&nbsp;S&nbsp;T&nbsp;Q&nbsp;Q&nbsp;S&nbsp;S</div>
              <div id="days" class="days-grid"></div>
            </aside>

            <section class="customer-panel details-left">
              <div class="customer-info">
                <h4>Seus dados</h4>
                <div class="form-group">
                  <label for="customerName">Nome completo</label>
                  <input type="text" id="customerName" class="input-padrao" placeholder="Nome completo" required>
                </div>
                <div class="form-group">
                  <label for="customerEmail">E-mail</label>
                  <input type="email" id="customerEmail" class="input-padrao" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                  <label for="customerPhone">Telefone</label>
                  <input type="tel" id="customerPhone" class="input-padrao" placeholder="(xx) xxxxx-xxxx" required>
                </div>
              </div>
            </section>

            <section class="availability-panel details-right">
              <div class="reservation-meta">
                <div class="selected-summary">
                  <h4>Dia selecionado</h4>
                  <p id="selectedDay">Nenhum dia</p>
                </div>
                <div class="services">
                  <label for="serviceSelect">Serviço</label>
                  <select id="serviceSelect">
                    <option value="corte">Corte de Cabelo — 45min</option>
                    <option value="barba">Barba — 30min</option>
                    <option value="combo">Combo Premium — 90min</option>
                  </select>
                </div>
              </div>

              <div class="availability">
                <h4>Disponibilidade por funcionário</h4>
                <div id="staffList" class="staff-list"></div>
              </div>

              <div class="confirm-area">
                <p id="chosenInfo">Nenhum horário escolhido</p>
                <button id="confirmBtn" class="btn btn-primary" disabled>Confirmar agendamento</button>
              </div>
            </section>
          </div>
        </section>
      </main>

      <footer class="footer">
        <img src="../imagens/logo_branco.png" alt="Logo branco Gu-Barber">
        
        <div class="footer-center">
          <a href="avaliar.html" class="footer-link">Avalie-nos</a>
          <a href="agendamento.html" class="footer-link">Marcar Horário</a>
          <p class="copy">&copy; copyright Gu-Barber Shop - 2026</p>
        </div>

        <div class="footer-socials">
        <!-- Instagram -->
        <a href="https://instagram.com" target="_blank" aria-label="Instagram da barbearia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        </a>
        
        <!-- Facebook -->
        <a href="https://facebook.com" target="_blank" aria-label="Facebook da barbearia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
            </svg>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/5551999999999" target="_blank" aria-label="WhatsApp da barbearia">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <path d="M17.6 6.32A8.86 8.86 0 0 0 12.05 4a8.94 8.94 0 0 0-7.74 13.4L3 21l3.7-1.27a8.93 8.93 0 0 0 4.31 1.1h.04a8.94 8.94 0 0 0 8.93-8.9 8.83 8.83 0 0 0-2.38-5.61zm-5.55 13.7h-.03a7.4 7.4 0 0 1-3.78-1.04l-.27-.16-2.81.97.94-2.73-.18-.28a7.44 7.44 0 0 1-1.14-3.95 7.45 7.45 0 0 1 12.7-5.27 7.36 7.36 0 0 1 2.17 5.24 7.45 7.45 0 0 1-7.6 7.22zm4.08-5.58c-.22-.11-1.31-.65-1.51-.72-.2-.08-.35-.11-.5.11-.15.22-.57.72-.7.87-.13.15-.26.16-.48.05a6.06 6.06 0 0 1-1.78-1.1 6.7 6.7 0 0 1-1.23-1.53c-.13-.22-.01-.34.11-.45.11-.11.25-.28.37-.42a.55.55 0 0 0 .09-.55c-.05-.11-.5-1.2-.69-1.65-.18-.43-.36-.37-.5-.37-.13 0-.28-.01-.43-.01a.83.83 0 0 0-.6.28 2.52 2.52 0 0 0-.79 1.88c0 1.11.81 2.18.92 2.33.11.15 1.57 2.4 3.8 3.27 1.86.73 2.24.59 2.65.55.4-.04 1.31-.54 1.49-1.06.18-.52.18-.96.13-1.06-.05-.1-.2-.16-.42-.27z"></path>
            </svg>
        </a>
    </div>
      </footer>
    </div>
  </div>

  <script src="../js/agendamento.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
